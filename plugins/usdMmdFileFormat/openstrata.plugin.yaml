# OpenStrata plugin bundle manifest.
# A plugin is a self-describing bundle, not a bare shared library: this file is
# the contract `ost plugin inspect|build|doctor|test` resolve against.
manifest:
  schema: openstrata.plugin/v1alpha1
plugin:
  name: usdMmdFileFormat
  # Mirrors the repository-root VERSION file (WORKSPACE.md §4).
  version: 0.1.0
  kind: usd-fileformat
license: Apache-2.0
runtime:
  # The one OpenUSD release this bundle supports; cmake/UsdMmdOpenUsd.cmake
  # enforces the same pin at configure time for builds that never see ost
  # (docs/architecture/DEPENDENCIES.md §1).
  openusd: "==26.08"
  # Source bundles inherit the resolved runtime ABI, so one manifest serves
  # Windows (msvc143), macOS (libcxx) and Linux (libstdcxx).
  cxx_abi: inherit
provides:
  - usd-fileformat:pmx
requires:
  capabilities: [usd-stage-read]
  # The PMX syntax parser and the canonical model, plain libraries
  # (libs/mmdPmx, libs/mmdModel). ost validates each edge against the
  # library's openstrata.library.yaml, builds the libraries into the workspace
  # prefix before configuring this bundle, and stages them into the package
  # (WORKSPACE.md §2.1, §2.3).
  libraries:
    - id: mmdPmx
      version: ">=0.1,<0.2"
    - id: mmdModel
      version: ">=0.1,<0.2"
  # MmdMaterialAPI, which every material applies from stage-contract v2
  # (MATERIAL_POLICY.md §4.3). ost builds the bundle before configuring this
  # one and composes it into every session and package of this one, so the
  # applied schema is discoverable wherever the importer runs. The contract
  # pin selects the schema's authored-data contract, independent of its
  # implementation version.
  bundles:
    - id: mmdSchema
      version: ">=0.1,<0.2"
      contract: 1
usd:
  # Where this bundle's plugInfo.json lives, relative to the bundle root.
  plug_info: plugin/resources/usdMmdFileFormat/plugInfo.json
# Written by the workspace's fixture generator (tests/fixtures/
# generate_fixtures.py); tests/fixtures/fixtures.json here says what each one
# must do, and tests/integration/ asserts the stage contract over them. They
# live in the bundle because ost accepts no fixture path outside it. Every
# fixture that opens is a smoke input -- the recoverable ones included, since
# opening with a recorded diagnostic is what they are for -- and every fatal
# one is a negative input. The roundtrip goldens are the empty stage and a
# whole canonical stage -- skeleton, every 2.0 deform type, material subsets,
# provenance (DESIGN_POLICY.md §13). That second one is the fixture whose
# texture paths are all refused: `usdcat --flatten` anchors every asset path
# it writes to an absolute one, and a golden must carry no machine-local path.
tests:
  smoke:
    - tests/fixtures/minimal.pmx
    - tests/fixtures/minimal-2.1-utf8.pmx
    - tests/fixtures/unknown-globals.pmx
    - tests/fixtures/sample-2.0-utf16.pmx
    - tests/fixtures/sample-2.1-utf8.pmx
    - tests/fixtures/sample-2.1-utf16-wide.pmx
    - tests/fixtures/bones-reordered.pmx
    - tests/fixtures/identifiers.pmx
    - tests/fixtures/recoverable/index-out-of-range.pmx
    - tests/fixtures/recoverable/invalid-utf16-name.pmx
    - tests/fixtures/recoverable/invalid-utf8-name.pmx
    - tests/fixtures/recoverable/material-faces-short.pmx
    - tests/fixtures/recoverable/trailing-bytes.pmx
    - tests/fixtures/recoverable/bone-parent-cycle.pmx
    - tests/fixtures/recoverable/weights-normalized.pmx
    - tests/fixtures/recoverable/unsafe-texture-paths.pmx
    - tests/fixtures/recoverable/no-bones.pmx
    - tests/fixtures/recoverable/morph-unknown-panel.pmx
    - tests/fixtures/recoverable/morph-group-cycle.pmx
    - tests/fixtures/recoverable/morph-no-skeleton.pmx
    - tests/fixtures/recoverable/morph-no-mesh.pmx
    - tests/fixtures/recoverable/rig-broken-relations.pmx
    - tests/fixtures/recoverable/physics-repairs.pmx
    - tests/fixtures/packaging/textures.pmx
    - tests/fixtures/packaging/missing-texture.pmx
    - tests/fixtures/packaging/unsupported-texture.pmx
    - tests/fixtures/packaging/name-collision.pmx
  roundtrip:
    - tests/fixtures/minimal.pmx
    - tests/fixtures/recoverable/unsafe-texture-paths.pmx
  negative:
    - tests/fixtures/malformed/bad-signature.pmx
    - tests/fixtures/malformed/unsupported-version.pmx
    - tests/fixtures/malformed/truncated-header.pmx
    - tests/fixtures/malformed/truncated-inside-vertex.pmx
    - tests/fixtures/malformed/count-exceeds-buffer.pmx
    - tests/fixtures/malformed/negative-count.pmx
    - tests/fixtures/malformed/text-length-exceeds-buffer.pmx
    - tests/fixtures/malformed/invalid-deform-type.pmx
    - tests/fixtures/malformed/qdef-in-2.0.pmx
    - tests/fixtures/malformed/face-count-not-triangles.pmx
    - tests/fixtures/malformed/face-index-out-of-range.pmx
    - tests/fixtures/malformed/material-faces-exceed-table.pmx
    - tests/fixtures/malformed/invalid-toon-reference.pmx
    - tests/fixtures/malformed/invalid-morph-type.pmx
    - tests/fixtures/malformed/flip-morph-in-2.0.pmx
    - tests/fixtures/malformed/invalid-frame-element.pmx
