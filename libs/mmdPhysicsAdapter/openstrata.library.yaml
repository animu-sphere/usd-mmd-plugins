schema: openstrata.library/v1alpha1
library:
  id: mmdPhysicsAdapter
  version: 0.3.0
requires:
  libraries:
    - id: mmdControl
      version: ">=0.3,<0.4"
cmake:
  package: mmdPhysicsAdapter
  target: mmdPhysicsAdapter::mmdPhysicsAdapter
package:
  standalone: true
  aggregate_member: false
package_contract:
  package_name: mmdPhysicsAdapter
  exported_targets: [mmdPhysicsAdapter::mmdPhysicsAdapter]
  public_headers: [include/mmdPhysicsAdapter/**]
  consumer:
    include: mmdPhysicsAdapter/Adapter.h
    symbol: mmd::physics::Adapter::Bind
