# OpenStrata CI support matrix for usd-mmd-plugins.
#
# Policy: this file is the CI contract; .github/workflows/ost-*.yml are
# renderer output from `ost ci generate github`. Do not hand-edit CI semantics
# in the generated workflow YAML -- change this file and regenerate. Three
# workflows are hand-written, each for what this matrix cannot express:
# docs-check.yml checks documentation and builds nothing;
# parser-sanitizers.yml builds mmdPmx, mmdModel, motionVmd,
# mmdMotionBinding and mmdControl on their own -- no runtime, since none links
# OpenUSD -- under ASan and UBSan, and fuzzes both readers (docs/architecture/
# WORKSPACE.md §3, §6); and release.yml, on a tag, packages the product and
# drafts the GitHub release. release.yml MIRRORS this file's ost version,
# runtime digests, OpenUSD requirement, host packages and pyramid depths --
# re-pin it with them (docs/releases/README.md).
#
# Lanes: one, `pull_request`, on GitHub-hosted runners. Each runner bootstraps
# the pinned `ost` below and pulls the runtime SDK from its OCI reference.
#
# Runtimes: the OpenUSD 26.08 leaves of OpenStrata's canonical runtime matrix,
# the same three digests usd-vrm-plugins pins (its openstrata.ci.yaml records
# their provenance). The ecosystem pins one OpenUSD release because
# usd-avatar-runtime composes every plugin into one process
# (docs/architecture/DEPENDENCIES.md §1), so these are re-pinned together.
#
#   NOT `core` leaves: they are built --no-imaging, and this workspace needs
#   nothing from imaging -- but the `gl`/`metal` leaves are the ones the rest
#   of the ecosystem runs, and matching them keeps one OpenUSD build per
#   platform across the repositories.
#
# X11: OpenUSD 26.08's MaterialX exports an unconditional
# `find_dependency(X11 REQUIRED COMPONENTS Xt)` on non-Apple UNIX, so a Linux
# consumer of the runtime cannot configure without the X11 development
# headers. Every Linux cell declares them as `host_packages`.
#
# OpenUSD requirement: every cell that consumes a runtime declares
# `require_openusd` (the leaf's platform/os/arch/variant) and
# `require_openusd_version: "26.08"`, so `ost artifact pull|verify` refuses a
# re-pinned digest that is not the release cmake/UsdMmdOpenUsd.cmake pins. It
# also keeps the rendered macOS steps runnable when they expand
# "${openusd_args[@]}" under `set -u`: macOS's bash 3.2 treats an empty array
# there as unbound (the first CI run of this repository failed on exactly that,
# before any build step). The 0.23.2 pin was required for external-library
# artifact declarations and for composing their prefixes into root builds;
# 0.23.3 (2026-09-23) adds a tool's own library edges to both, validates them
# in the graph, and discards a build tree configured against another runtime
# (usd-vrm-plugins' ost report 44); 0.23.4 (2026-09-24) applies that runtime
# check to `ost library build` and `ost plugin build` too, and adds pins for a
# published bundle and test tool (usd-vrm-plugins' ost report 45). Each is
# re-pinned across the ecosystem together.
#
# Cell inventory -- ten:
#   * workspace-graph-pr: the WORKSPACE.md §2 dependency gate, before anything
#     builds.
#   * workspace-pr-{windows,macos-arm64,linux}: the root CMake tree and its
#     whole CTest suite -- the mmdPmx, mmdModel, motionVmd,
#     mmdMotionBinding and mmdControl unit, robustness, boundary and table
#     tests, the
#     mmd_inspect and vmd_inspect fixture and boundary tests, the fixture
#     check, the stage-open, Unicode-path and notice-listener integration
#     tests, and the installed-consumer lane (workspace_installed_consumer).
#   * usdmmdfileformat-pr-*: the only lanes that configure the bundle
#     STANDALONE -- `ost plugin build` with no root tree in scope, the
#     requires.libraries closure built into the workspace prefix -- and run
#     `ost plugin package`. The workspace cells cannot reach either.
#     The Windows cell stops at L4: hosted-Windows `usdcat --flatten --out`
#     writes CR into multi-line USDA strings, and the golden's `doc` is one
#     (usd-vrm-plugins' Phase 3 dogfood report). macOS and Linux run L5.
#   * mmdschema-pr-*: the same standalone `ost plugin build` and pyramid for
#     the schema bundle -- L2 registration, L4 apply round trip, and L5 over
#     its hand-authored fixture, with no importer in the session. Windows
#     stops at L4 for the same reason: the golden's `doc` is multi-line.
schema: 1

bootstrap:
  ost:
    version: "0.23.4"
    repository: animu-sphere/open-strata

runners:
  windows-hosted:
    kind: github-hosted
    image: windows-2022
    billing:
      acknowledgement: required
  macos-arm64-hosted:
    kind: github-hosted
    image: macos-15
    billing:
      acknowledgement: required
  linux-hosted:
    kind: github-hosted
    image: ubuntu-24.04
    billing:
      acknowledgement: required

cells:
  - name: workspace-graph-pr
    kind: workspace
    lane: pull_request
    runner: linux-hosted
    # A graph cell never materializes a runtime, but the contract still wants
    # the pin on record.
    runtime_artifact: sha256:3bf31789daa60ef650df35ab276bd67d0c0ee44a960311f78835cc0962efe261
    runtime_remote:
      uri: oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:8d2d599489ee623044f4360ad3a2b979e2966e6ad2f949e5aa9083570e59cc4f
      expected_oci_digest: sha256:8d2d599489ee623044f4360ad3a2b979e2966e6ad2f949e5aa9083570e59cc4f
    platform: cy2026
    profile: usd
    verify: graph

  - name: workspace-pr-windows
    kind: workspace
    lane: pull_request
    runner: windows-hosted
    runtime_artifact: sha256:ebb0c7da509ee14ada19ee5b461de6996aad0024b5c9640f12dde76912e849b5
    runtime_remote:
      uri: oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:d3ff79a6f330558c3b9a427a927d340fe3dcab1fe89107faa0ea9f66a104b7bf
      expected_oci_digest: sha256:d3ff79a6f330558c3b9a427a927d340fe3dcab1fe89107faa0ea9f66a104b7bf
    platform: cy2026
    profile: usd
    require_openusd: cy2026/windows/x86_64/gl
    require_openusd_version: "26.08"
    # The Windows runtime bundles no interpreter; the integration tests import
    # the OpenUSD bindings into a Python 3.13 the runner must provide.
    host_python: "3.13"
    verify: test

  - name: workspace-pr-macos-arm64
    kind: workspace
    lane: pull_request
    runner: macos-arm64-hosted
    runtime_artifact: sha256:8d1322126b8f3aa4dd1791184603d7e1b4571bd4d6d89dd80bb75bdf5eef397c
    runtime_remote:
      uri: oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:8486d94286b60cc20b53c926757f1802442569f9d9a7eecdadf2c9895b2efeb6
      expected_oci_digest: sha256:8486d94286b60cc20b53c926757f1802442569f9d9a7eecdadf2c9895b2efeb6
    platform: cy2026
    profile: usd
    require_openusd: cy2026/macos/arm64/metal
    require_openusd_version: "26.08"
    host_python: "3.13"
    verify: test

  - name: workspace-pr-linux
    kind: workspace
    lane: pull_request
    runner: linux-hosted
    runtime_artifact: sha256:3bf31789daa60ef650df35ab276bd67d0c0ee44a960311f78835cc0962efe261
    runtime_remote:
      uri: oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:8d2d599489ee623044f4360ad3a2b979e2966e6ad2f949e5aa9083570e59cc4f
      expected_oci_digest: sha256:8d2d599489ee623044f4360ad3a2b979e2966e6ad2f949e5aa9083570e59cc4f
    platform: cy2026
