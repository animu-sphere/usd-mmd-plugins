# OpenStrata workspace-tool descriptor.
#
# mmd_inspect reports what a PMX contains, with mmdPmx and without USD
# (docs/architecture/WORKSPACE.md §1, §2.1). It ships in the product beside the
# file-format bundle: a parser question should be answerable from the package
# a user already has.
schema: openstrata.tool/v1alpha1
tool:
  id: mmd_inspect
  # Mirrors the repository-root VERSION file (WORKSPACE.md §4).
  version: 0.1.0
  license: Apache-2.0
executables: [mmd_inspect]
directories: [bin]
requires:
  libraries:
    - id: mmdPmx
      version: ">=0.1,<0.2"
