# Hand-written (not generated by `ost ci generate`).
#
# The PMX parser, the canonical model, the VMD reader and motion binding under
# AddressSanitizer and UndefinedBehaviorSanitizer, and both readers' libFuzzer
# targets over corpora seeded with the generated fixtures
# (docs/design/DESIGN_POLICY.md §13). No library here links OpenUSD, so this
# lane needs no runtime and no `ost`: it configures libs/mmdPmx and
# libs/motionVmd on their own, as `ost library build` does, installs each
# library instrumented, and configures the ones that depend on them against
# that prefix, each with the sanitizer options its CMakeLists.txt declares. `ost ci generate` has no
# way to express a sanitizer build, which is why this workflow exists beside
# the generated one rather than inside it.
name: parser-sanitizers

on:
  pull_request:
    paths:
      - "libs/mmdPmx/**"
      - "libs/mmdModel/**"
      - "libs/motionVmd/**"
      - "libs/mmdMotionBinding/**"
      - "tests/fixtures/generate_fixtures.py"
      - "tests/fixtures/generate_vmd_fixtures.py"
      - "cmake/UsdMmdTargets.cmake"
      - "scripts/check_library_boundaries.py"
      - ".github/workflows/parser-sanitizers.yml"
  push:
    branches: [main]
    paths:
      - "libs/mmdPmx/**"
      - "libs/mmdModel/**"
      - "libs/motionVmd/**"
      - "libs/mmdMotionBinding/**"
      - "tests/fixtures/generate_fixtures.py"
      - "tests/fixtures/generate_vmd_fixtures.py"
      - "cmake/UsdMmdTargets.cmake"
      - "scripts/check_library_boundaries.py"
      - ".github/workflows/parser-sanitizers.yml"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "How long the fuzzer runs"
        default: "120"

permissions:
  contents: read

jobs:
  mmdpmx:
    name: mmdPmx and mmdModel ASan+UBSan, and fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FUZZ_SECONDS: ${{ inputs.fuzz_seconds || '120' }}
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang 18 with its sanitizer and libFuzzer runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev ninja-build

      - name: Configure mmdPmx alone, instrumented
        run: >
          cmake -S libs/mmdPmx -B build/sanitize -G Ninja
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DMMDPMX_BUILD_TESTS=ON
          -DMMDPMX_SANITIZERS="address;undefined"
          -DMMDPMX_BUILD_FUZZER=ON

      - name: Build
        run: cmake --build build/sanitize

      - name: mmdPmx unit, robustness and boundary tests under the sanitizers
        run: ctest --test-dir build/sanitize --output-on-failure

      # The fuzzer's coverage hooks are compiled into this build; a consumer
      # of the installed archive would need libFuzzer too, so mmdModel is
      # built against a second, sanitizer-only mmdPmx.
      - name: Install an instrumented mmdPmx for mmdModel
        run: |
          cmake -S libs/mmdPmx -B build/sanitize-pmx -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMMDPMX_BUILD_TESTS=OFF \
            -DMMDPMX_SANITIZERS="address;undefined"
          cmake --build build/sanitize-pmx
          cmake --install build/sanitize-pmx --prefix build/sanitize-prefix

      - name: Configure and build mmdModel against it, instrumented
        run: |
          cmake -S libs/mmdModel -B build/sanitize-model -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$PWD/build/sanitize-prefix" \
            -DMMDMODEL_BUILD_TESTS=ON \
            -DMMDMODEL_SANITIZERS="address;undefined"
          cmake --build build/sanitize-model

      - name: mmdModel unit, robustness and boundary tests under the sanitizers
        run: ctest --test-dir build/sanitize-model --output-on-failure

      - name: Configure motionVmd alone, instrumented
        run: >
          cmake -S libs/motionVmd -B build/sanitize-vmd -G Ninja
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DMOTIONVMD_BUILD_TESTS=ON
          -DMOTIONVMD_SANITIZERS="address;undefined"
          -DMOTIONVMD_BUILD_FUZZER=ON

      - name: Build motionVmd
        run: cmake --build build/sanitize-vmd

      - name: motionVmd unit, robustness, boundary and table tests under the sanitizers
        run: ctest --test-dir build/sanitize-vmd --output-on-failure

      # As for mmdPmx: binding links a sanitizer-only motionVmd, and the
      # instrumented mmdModel built above.
      - name: Install instrumented motionVmd and mmdModel for mmdMotionBinding
        run: |
          cmake -S libs/motionVmd -B build/sanitize-vmd-lib -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMOTIONVMD_BUILD_TESTS=OFF \
            -DMOTIONVMD_SANITIZERS="address;undefined"
          cmake --build build/sanitize-vmd-lib
          cmake --install build/sanitize-vmd-lib --prefix build/sanitize-prefix
          cmake --install build/sanitize-model --prefix build/sanitize-prefix

      - name: Configure and build mmdMotionBinding against them, instrumented
        run: |
          cmake -S libs/mmdMotionBinding -B build/sanitize-binding -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$PWD/build/sanitize-prefix" \
            -DMMDMOTIONBINDING_BUILD_TESTS=ON \
            -DMMDMOTIONBINDING_SANITIZERS="address;undefined"
          cmake --build build/sanitize-binding

      - name: mmdMotionBinding unit and boundary tests under the sanitizers
        run: ctest --test-dir build/sanitize-binding --output-on-failure

      - name: Seed the corpora with the generated fixtures
        run: |
          python3 tests/fixtures/generate_fixtures.py --out build/seeds
          mkdir -p build/corpus
          python3 tests/fixtures/generate_vmd_fixtures.py --out build/vmd-seeds
          mkdir -p build/vmd-corpus

      - name: Fuzz
        run: >
          build/sanitize/fuzz/mmdPmx_fuzz
          -max_total_time=${FUZZ_SECONDS}
          -timeout=10
          -rss_limit_mb=2048
          -max_len=65536
          -print_final_stats=1
          -artifact_prefix=build/crash-
          build/corpus build/seeds

      - name: Fuzz motionVmd
        run: >
          build/sanitize-vmd/fuzz/motionVmd_fuzz
          -max_total_time=${FUZZ_SECONDS}
          -timeout=10
          -rss_limit_mb=2048
          -max_len=65536
          -print_final_stats=1
          -artifact_prefix=build/vmd-crash-
          build/vmd-corpus build/vmd-seeds

      - name: Keep what the fuzzer found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mmdpmx-fuzz-artifacts
          path: |
            build/crash-*
            build/corpus
            build/vmd-crash-*
            build/vmd-corpus
          if-no-files-found: ignore
