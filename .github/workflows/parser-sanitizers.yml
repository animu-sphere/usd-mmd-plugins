# Hand-written (not generated by `ost ci generate`).
#
# The parser under AddressSanitizer and UndefinedBehaviorSanitizer, and the
# libFuzzer target over a corpus seeded with the generated fixtures
# (docs/design/DESIGN_POLICY.md §13). mmdPmx links no OpenUSD, so this lane
# needs no runtime and no `ost`: it configures libs/mmdPmx on its own, as
# `ost library build` does, with the sanitizer options that file declares.
# `ost ci generate` has no way to express a sanitizer build, which is why this
# workflow exists beside the generated one rather than inside it.
name: parser-sanitizers

on:
  pull_request:
    paths:
      - "libs/mmdPmx/**"
      - "tests/fixtures/generate_fixtures.py"
      - "cmake/UsdMmdTargets.cmake"
      - "scripts/check_library_boundaries.py"
      - ".github/workflows/parser-sanitizers.yml"
  push:
    branches: [main]
    paths:
      - "libs/mmdPmx/**"
      - "tests/fixtures/generate_fixtures.py"
      - "cmake/UsdMmdTargets.cmake"
      - "scripts/check_library_boundaries.py"
      - ".github/workflows/parser-sanitizers.yml"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "How long the fuzzer runs"
        default: "120"

permissions:
  contents: read

jobs:
  mmdpmx:
    name: mmdPmx ASan+UBSan and fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FUZZ_SECONDS: ${{ inputs.fuzz_seconds || '120' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang 18 with its sanitizer and libFuzzer runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev ninja-build

      - name: Configure mmdPmx alone, instrumented
        run: >
          cmake -S libs/mmdPmx -B build/sanitize -G Ninja
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DMMDPMX_BUILD_TESTS=ON
          -DMMDPMX_SANITIZERS="address;undefined"
          -DMMDPMX_BUILD_FUZZER=ON

      - name: Build
        run: cmake --build build/sanitize

      - name: Unit, robustness and boundary tests under the sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/sanitize --output-on-failure

      - name: Seed the corpus with the generated fixtures
        run: |
          python3 tests/fixtures/generate_fixtures.py --out build/seeds
          mkdir -p build/corpus

      - name: Fuzz
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >
          build/sanitize/fuzz/mmdPmx_fuzz
          -max_total_time=${FUZZ_SECONDS}
          -timeout=10
          -rss_limit_mb=2048
          -max_len=65536
          -print_final_stats=1
          -artifact_prefix=build/crash-
          build/corpus build/seeds

      - name: Keep what the fuzzer found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mmdpmx-fuzz-artifacts
          path: |
            build/crash-*
            build/corpus
          if-no-files-found: ignore
