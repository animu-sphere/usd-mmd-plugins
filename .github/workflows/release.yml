# Hand-written (not generated by `ost ci generate`).
#
# A release. Pushing a tag `vX.Y.Z` -- equal to the repository-root VERSION,
# with a dated `## [X.Y.Z] - YYYY-MM-DD` section in CHANGELOG.md -- builds the
# workspace on the same three cells and digest-pinned runtimes as the pull
# request lanes, proves the packaged artifacts, and assembles a DRAFT GitHub
# release: per target the usdMmdFileFormat bundle, the mmd_inspect and
# vmd_inspect tools and the aggregate product, each with its manifest; a
# source archive; SHA256SUMS; and notes rendered from the changelog through
# docs/contributing/RELEASE_NOTES_TEMPLATE.md. Publishing the draft is a
# human decision (docs/releases/README.md).
#
# `workflow_dispatch` is the dry run: the same lanes, everything uploaded as
# workflow artifacts, no release object created.
#
# The pins below MIRROR openstrata.ci.yaml -- the ost version, the three
# runtime digests and their remotes, the OpenUSD requirement, the X11 host
# packages and each cell's pyramid depth. This file is outside that contract,
# so regenerating the pull request lanes never updates it, and a green pull
# request says nothing about it; re-pin both together.
#
# Fork safety: runs only on a tag push or a manual dispatch, never on
# pull_request; only the release job's token can write.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: preflight (tag = VERSION, changelog dated)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Resolve the release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$file_version" ]; then
              echo "::error title=release preflight::tag ${GITHUB_REF_NAME} does not match VERSION ($file_version)" ; exit 1
            fi
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$file_version" >> "$GITHUB_OUTPUT"
      - name: Check the version mirrors and the documentation
        run: python3 scripts/check_docs.py
      - name: Check the release notes render
        shell: bash
        run: |
          set -euo pipefail
          extra=""
          if [ "${{ steps.version.outputs.is_release }}" != "true" ]; then extra="--allow-unreleased"; fi
          python3 scripts/make_release_notes.py --version "${{ steps.version.outputs.version }}" $extra > /dev/null

  build:
    name: ${{ matrix.name }}
    needs: preflight
    runs-on: ${{ matrix.runs_on }}
    env:
      OST_HOME: ${{ format('{0}/.ost-ci-home', github.workspace) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release-windows
            cache_cell: workspace-pr-windows
            runtime_artifact: sha256:ebb0c7da509ee14ada19ee5b461de6996aad0024b5c9640f12dde76912e849b5
            runtime_remote: "oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:d3ff79a6f330558c3b9a427a927d340fe3dcab1fe89107faa0ea9f66a104b7bf"
            require_openusd: "cy2026/windows/x86_64/gl"
            runs_on: ["windows-2022"]
            # openstrata.ci.yaml: hosted-Windows `usdcat --flatten --out`
            # writes CR into the golden's multi-line `doc`, so L5 is not run.
            up_to: 4
          - name: release-macos-arm64
            cache_cell: workspace-pr-macos-arm64
            runtime_artifact: sha256:8d1322126b8f3aa4dd1791184603d7e1b4571bd4d6d89dd80bb75bdf5eef397c
            runtime_remote: "oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:8486d94286b60cc20b53c926757f1802442569f9d9a7eecdadf2c9895b2efeb6"
            require_openusd: "cy2026/macos/arm64/metal"
            runs_on: ["macos-15"]
            up_to: 5
          - name: release-linux
            cache_cell: workspace-pr-linux
            runtime_artifact: sha256:3bf31789daa60ef650df35ab276bd67d0c0ee44a960311f78835cc0962efe261
            runtime_remote: "oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:8d2d599489ee623044f4360ad3a2b979e2966e6ad2f949e5aa9083570e59cc4f"
            require_openusd: "cy2026/linux/x86_64/gl"
            runs_on: ["ubuntu-24.04"]
            up_to: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # OpenUSD 26.08's MaterialX config needs X11 on non-Apple UNIX before
      # find_package(pxr) can succeed (openstrata.ci.yaml).
      - name: Install the X11 development headers the runtime needs
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxt-dev
      - name: Bootstrap ost 0.23.2 (pinned release asset, checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)   triple=x86_64-unknown-linux-musl ; ext=tar.xz ;;
            macOS-ARM64) triple=aarch64-apple-darwin ; ext=tar.xz ;;
            Windows-X64) triple=x86_64-pc-windows-msvc ; ext=zip ;;
            *) echo "::error title=ost bootstrap::no ost release asset for ${RUNNER_OS}-${RUNNER_ARCH}" ; exit 1 ;;
          esac
          asset="ost-cli-${triple}.${ext}"
          base="https://github.com/animu-sphere/open-strata/releases/download/v0.23.2"
          curl -fsSLo "$asset" "$base/$asset"
          curl -fsSLo "$asset.sha256" "$base/$asset.sha256"
          actual="$( (command -v sha256sum > /dev/null && sha256sum "$asset" || shasum -a 256 "$asset") | cut -d' ' -f1 )"
          published="$(cut -d' ' -f1 "$asset.sha256")"
          if [ "$actual" != "$published" ]; then
            echo "::error title=ost bootstrap::$asset hashes to $actual but the release publishes $published" ; exit 1
          fi
          mkdir -p .ost-ci/bootstrap-bin
          if [ "$ext" = "zip" ]; then
            powershell -NoProfile -Command "Expand-Archive -LiteralPath '$asset' -DestinationPath '.ost-ci/bootstrap-bin' -Force"
          else
            tar -xf "$asset" -C .ost-ci/bootstrap-bin
          fi
          bin="$(find .ost-ci/bootstrap-bin -type f \( -name ost -o -name ost.exe \) | head -n 1)"
          if [ -z "$bin" ]; then echo "::error title=ost bootstrap::no ost binary inside $asset" ; exit 1 ; fi
          chmod +x "$bin" 2> /dev/null || true
          bin_dir="$(cd "$(dirname "$bin")" && pwd)"
          # A native path: Windows CreateProcess, which the smoke's Python
          # uses to start `ost`, cannot see a POSIX /d/a/... PATH entry.
          if [ "$RUNNER_OS" = "Windows" ]; then bin_dir="$(cygpath -w "$bin_dir")"; fi
          echo "$bin_dir" >> "$GITHUB_PATH"
      - name: Check ost is available
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            version="$(powershell -NoProfile -Command "& ost.exe --version" | tr -d '\r')"
          else
            version="$(ost --version)"
          fi
          echo "$version"
          if [ "$version" != "ost 0.23.2" ]; then
            echo "::error title=ost bootstrap::expected 'ost 0.23.2', got '$version'" ; exit 1
          fi
      # Restore only: the pull request lanes own these entries, and a release
      # run must not write a cache a later pull request would trust.
      - name: Restore the artifact registry cache (speed only, never correctness)
        if: ${{ vars.OST_CI_DISABLE_CACHE != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ost-ci-home/artifacts
          key: ost-registry-0.23.2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache_cell }}-${{ matrix.runtime_artifact }}
      # The cache-hit test is the same predicate as the gate below, so a cached
      # record that would fail the gate drops through to a fresh pull.
      - name: Pull the pinned runtime SDK from its remote reference
        shell: bash
        run: |
          set -euo pipefail
          openusd_args=(--require-openusd "${{ matrix.require_openusd }}" --require-openusd-version 26.08)
          if ost artifact show "${{ matrix.runtime_artifact }}" --json > /dev/null 2>&1 \
             && ost artifact verify "${{ matrix.runtime_artifact }}" --minimum-trust local \
                  --require-sbom --require-provenance "${openusd_args[@]}" --json > /dev/null; then
            echo "pinned runtime already present and verified (cache hit) -- skipping the remote pull"
          else
            rm -rf "${OST_HOME}/artifacts"
            ost artifact pull "${{ matrix.runtime_remote }}" --expect-artifact "${{ matrix.runtime_artifact }}" --require-kind runtime "${openusd_args[@]}" --json
          fi
      - name: Verify and materialize the pinned runtime SDK
        shell: bash
        run: |
          set -euo pipefail
          ost artifact verify "${{ matrix.runtime_artifact }}" --minimum-trust local --require-sbom --require-provenance \
            --require-openusd "${{ matrix.require_openusd }}" --require-openusd-version 26.08
          ost runtime pull cy2026 --profile usd --from-artifact "${{ matrix.runtime_artifact }}" --force
          ost runtime validate cy2026 --profile usd --json > /dev/null
      - name: Pull digest-pinned external library artifacts
        shell: bash
        run: ost library pull --target cy2026 --profile usd --json
      - name: Set up host Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      # ORDER MATTERS. The root tree builds the plain libraries and both tools,
      # which no `ost plugin build` reaches -- `plugin package --workspace`
      # needs their binaries -- and it also rewrites the bundle's lib/ without
      # bundle-managed provenance. So the root build comes first and the bundle
      # build second, or packaging fails closed with
      # PLUGIN_PACKAGE_OUTPUT_MISMATCH (usd-vrm-plugins' release workflow).
      - name: Build the workspace root tree (libraries and tools)
        shell: bash
        run: ost build --target cy2026 --profile usd --progress plain
      - name: Build the bundle from source
        shell: bash
        run: ost plugin build plugins/usdMmdFileFormat --target cy2026 --profile usd
      - name: Run the verification pyramid against the build tree
        shell: bash
        run: ost plugin test plugins/usdMmdFileFormat --target cy2026 --profile usd --up-to ${{ matrix.up_to }} --json > /dev/null
      - name: Package the workspace (bundle, tools and the aggregate product)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ost-ci
          ost plugin package --workspace --product --target cy2026 --profile usd --json > .ost-ci/package.json
      - name: Prove packaging is digest-reproducible
        shell: bash
        run: |
          set -euo pipefail
          ost plugin package --workspace --product --target cy2026 --profile usd --json > .ost-ci/package-second.json
          python - <<'EOF'
          import json, sys
          def digests(path):
              data = json.load(open(path, encoding="utf-8"))["data"]
              found = {p["name"]: p["archive_digest"] for p in data["packages"]}
              found["product:" + data["product"]["name"]] = data["product"]["archive_digest"]
              return found
          first, second = digests(".ost-ci/package.json"), digests(".ost-ci/package-second.json")
          for name in sorted(first):
              print(name, first[name])
          if first != second:
              print("::error title=release packaging::two packaging runs of the same build disagree -- release checksums would be unstable")
              sys.exit(1)
          EOF
      - name: Run the verification pyramid against the package
        shell: bash
        run: ost plugin test plugins/usdMmdFileFormat --from-package --target cy2026 --profile usd --up-to ${{ matrix.up_to }} --json > /dev/null
      - name: Install the product and use it with nothing from the build tree
        shell: bash
        run: |
          set -euo pipefail
          product="$(python -c 'import json, pathlib; print(pathlib.Path(json.load(open(".ost-ci/package.json", encoding="utf-8"))["data"]["product"]["archive"]).parent)')"
          python scripts/product_smoke.py --product "$product"
      - name: Stage the release artifacts
        shell: bash
        run: python scripts/stage_release.py --package-json .ost-ci/package.json --out release-stage
      - name: Upload the staged artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.name }}
          path: release-stage/
          if-no-files-found: error

  release:
    name: assemble release (draft)
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download the per-target artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: dist-release
          merge-multiple: true
      - name: Add the source archive
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          git archive --format=tar.gz --prefix="usd-mmd-plugins-${version}/" \
            -o "dist-release/usd-mmd-plugins-${version}-src.tar.gz" HEAD
      - name: Write SHA256SUMS over every release file
        shell: bash
        run: |
          set -euo pipefail
          cd dist-release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Render the release notes from the changelog
        shell: bash
        run: |
          set -euo pipefail
          extra=""
          if [ "${{ needs.preflight.outputs.is_release }}" != "true" ]; then extra="--allow-unreleased"; fi
          python3 scripts/make_release_notes.py --version "${{ needs.preflight.outputs.version }}" \
            --checksums dist-release/SHA256SUMS --out release-notes.md $extra
          cat release-notes.md
      - name: Create the draft GitHub release
        if: ${{ needs.preflight.outputs.is_release == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ needs.preflight.outputs.version }}"
          gh release create "$tag" --draft --verify-tag \
            --title "usd-mmd-plugins $tag" \
            --notes-file release-notes.md \
            dist-release/*
      - name: Upload the dry-run bundle (workflow_dispatch only)
        if: ${{ needs.preflight.outputs.is_release != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dry-run
          path: |
            dist-release/
            release-notes.md
