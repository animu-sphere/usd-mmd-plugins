# Hand-written orchestration; source build steps remain generated by OST.
name: ci-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "How long the fuzzer runs"
        type: string
        default: "120"

permissions:
  contents: read

concurrency:
  group: ci-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      run_source: ${{ steps.classify.outputs.run_source }}
      run_parser: ${{ steps.classify.outputs.run_parser }}
      run_physics: ${{ steps.classify.outputs.run_physics }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Classify a complete diff (uncertainty selects full CI)
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/classify_ci_changes.py --github-output "$GITHUB_OUTPUT"

  docs:
    uses: ./.github/workflows/docs-check.yml

  source:
    needs: changes
    if: needs.changes.outputs.run_source == 'true'
    uses: ./.github/workflows/ost-source-ci.yml

  parser:
    needs: changes
    if: needs.changes.outputs.run_parser == 'true'
    uses: ./.github/workflows/parser-sanitizers.yml
    with:
      fuzz_seconds: ${{ inputs.fuzz_seconds || '120' }}

  physics:
    needs: changes
    if: needs.changes.outputs.run_physics == 'true'
    uses: ./.github/workflows/physics-installed.yml

  required-ci:
    name: required-ci
    if: always()
    needs: [changes, docs, source, parser, physics]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check every selected job result
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/check_ci_gate.py
