# Hand-written (not generated by `ost ci generate`).
#
# Documentation consistency: every relative link and heading anchor resolves,
# every place that restates the product version or the OpenUSD pin agrees
# with the one that defines it, and the diagnostic catalog matches the codes
# the components declare (scripts/check_docs.py). Deliberately cheap --
# no runtime SDK or OpenUSD. The pinned `ost` CLI is used only to check the
# generated workflow, never to pull/build a runtime.
name: docs-check

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: docs consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Check the checker's own rules
        run: python scripts/check_docs.py --selftest
      - name: Check links, anchors and mirrored versions
        run: python scripts/check_docs.py
      - name: Install the manifest reader
        run: python -m pip install PyYAML==6.0.2
      - name: Regress classification, aggregation and source rendering
        run: python -m unittest discover -s scripts -p test_ci_policy.py -v
      - name: Check source CI drift using the pinned CLI (no runtime SDK)
        run: python scripts/generate_source_ci.py --bootstrap --check
